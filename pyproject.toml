[project]
name = "clust-learn"
version = "0.2.8"
authors = [
  { name="Miguel Alvarez-Garcia", email="miguel.alvarez@urjc.es" },
]
description = "A Python package for explainable cluster analysis"
readme = "README.md"
requires-python = ">=3.9,<3.12"
classifiers = [
	"Programming Language :: Python :: 3",
	"License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
	"Topic :: Scientific/Engineering",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11"
]
# Dependencies are provided by setup.py's install_requires (single source of truth).
dynamic = ["dependencies"]

[project.urls]
"Homepage" = "https://github.com/malgar/clust-learn"
"Bug Tracker" = "https://github.com/malgar/clust-learn/issues"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
